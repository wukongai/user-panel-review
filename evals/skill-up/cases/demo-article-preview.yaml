id: demo-article-preview
title: 小白使用内置示例用户完成首次体验预览
description: 验证用户无需理解内部结构即可知道本次模拟哪些用户、为什么入选以及确认边界。

input:
  prompt: |
    我想先试试。请使用 $user-review 的内置示例用户看看当前工作区的 article.md。
    用普通语言告诉我这次会模拟哪些用户、为什么选他们，以及这只是 AI 模拟。
    只做开始前说明，等我确认后再开始，不要修改文章。

context:
  repo_fixture: skill-up/fixtures/demo-project

expect:
  must_contain:
    - "内置示例用户"
    - "模拟"
  must_not_contain:
    - "Audience Workspace"
    - "Persona"
    - "Panel"
    - "计划哈希"
    - "真实焦点小组已经"
    - "转化率将"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["内置示例用户", "模拟"]
        any: ["确认", "开始"]
        not: ["Audience Workspace", "Persona", "Panel", "计划哈希", "真实焦点小组已经", "转化率将"]
