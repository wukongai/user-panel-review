id: onboarding-boundary
title: 用自然语言整理长期目标用户
description: 验证 Agent 复述已知信息、只问一个关键问题，并隐藏后台路径与计划细节。

input:
  prompt: |
    使用 $user-review 帮我整理自己的长期目标用户。
    我做面向知识工作者的 AI 自媒体，他们听说过 AI，但还没有稳定用进工作。
    请先复述你已经知道的内容，然后只问我第一个会改变用户分层的关键问题。
    现在不要保存任何内容。

expect:
  must_contain:
    - "第一个关键问题"
    - "不保存"
  must_not_contain:
    - "Audience Workspace"
    - "Persona"
    - "Panel"
    - "计划哈希"
    - "Apply"
    - "已经创建完成"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["第一个关键问题", "不保存"]
        not: ["Audience Workspace", "Persona", "Panel", "计划哈希", "Apply", "已经创建完成"]
