id: user-review-mock-contract
name: User Review Natural Language Contract
description: 验证 Waza 能加载 Skill、任务、Prompt 和确定性 grader；mock 不代表真实 Agent 行为。
tags: [contract, mock, no-credential]

inputs:
  prompt: "使用 user-review 通过自然语言提供模拟目标用户反馈。普通用户不需要理解内部数据结构，也不要声称真实转化已经验证。"

expected:
  output_contains:
    - "自然语言"
    - "模拟目标用户反馈"
  outcomes:
    - type: task_completed

graders:
  - name: has-contract-language
    type: code
    config:
      assertions:
        - "'自然语言' in output"
        - "'模拟目标用户反馈' in output"
