name: release-check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill
        run: python skills/user-panel-review/scripts/panel_review.py validate-skill --skill-root skills/user-panel-review
      - name: Run tests
        run: python -m unittest tests.test_user_panel_review -v
